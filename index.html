<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ग्राम पंचायत पृथ्वीपुरा चुनाव 2026 - Live Portal</title>

    <!-- Google Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 15px; }
        .header { background: linear-gradient(to right, #2a5298, #1e3c72); color: white; text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .admin-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-wrap: wrap; gap: 10px; }
        .btn { background: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-admin { background: #e67e22; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; font-size: 15px; }
        .btn-delete { background: #c0392b; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 8px; width: 100%; font-weight: bold; }
        .section-title { background: #2c3e50; color: white; padding: 12px 18px; border-radius: 8px; margin: 20px 0 15px 0; font-size: 20px; border-left: 6px solid #e74c3c; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px 15px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.08); border: 1px solid #eee; }
        
        .card img { 
            width: 110px; 
            height: 110px; 
            object-fit: cover; 
            border-radius: 50%; 
            margin: 0 auto 12px auto; 
            display: block;
            border: 3px solid #2980b9; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            background-color: #eaeaea; 
        }

        .vote-btn { background: #2980b9; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 16px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .edit-fields { display: none; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px; text-align: left; font-size: 14px; }
        .edit-fields input[type="text"], .edit-fields input[type="file"] { width: 100%; padding: 8px; margin: 4px 0 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .results-section { background: white; border-radius: 12px; padding: 20px; margin-top: 30px; }
        .progress-bar-bg { background: #e0e0e0; border-radius: 20px; height: 22px; margin-top: 6px; overflow: hidden; }
        .progress-bar-fill { background: #27ae60; height: 100%; text-align: right; padding-right: 10px; color: white; font-size: 12px; line-height: 22px; font-weight: bold; width: 0%; transition: width 0.4s ease; }
        .login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .login-content { background: white; padding: 25px; border-radius: 10px; text-align: center; width: 300px; }
        .login-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .live-badge { background: #e74c3c; color: white; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ग्राम पंचायत पृथ्वीपुरा चुनाव 2026</h1>
        <p>सरपंच पद चुनाव एवं लाइव वोटिंग पोर्टल <span class="live-badge">🔴 LIVE UPDATE</span></p>
    </div>

    <div class="admin-bar">
        <span id="admin-status" style="font-weight: bold; color: #555;">मोड: सामान्य यूजर</span>
        <div>
            <button id="add-btn" class="btn" style="display:none; background:#8e44ad;" onclick="addCandidate()">+ नया प्रत्याशी</button>
            <button id="reset-vote-btn" class="btn" style="display:none; background:#7f8c8d;" onclick="resetVotes()">वोट रीसेट करें</button>
            <button id="auth-btn" class="btn btn-admin" onclick="toggleAuth()">Admin Login</button>
        </div>
    </div>

    <div class="section-title">🚩 सरपंच पद के प्रत्याशी</div>
    <div class="grid" id="sarpanch-grid">लाइव डेटा कनेक्ट हो रहा है...</div>

    <div class="results-section">
        <h2>📊 सरपंच पद लाइव नतीजे</h2>
        <div id="sarpanch-results"></div>
    </div>

    <div class="login-modal" id="loginModal">
        <div class="login-content">
            <h3>एडमिन लॉगिन</h3>
            <input type="password" id="adminPassword" placeholder="पासवर्ड दर्ज करें">
            <button class="btn" onclick="checkPassword()">लॉगिन</button>
            <button class="btn" style="background:#e74c3c; margin-top:5px;" onclick="closeLogin()">रद्द</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB0BuD5mx-ppM40j_O2m1H569malJNX26Y",
            authDomain: "panchayat-prithvipura-chunav.firebaseapp.com",
            databaseURL: "https://panchayat-prithvipura-chunav-default-rtdb.firebaseio.com",
            projectId: "panchayat-prithvipura-chunav",
            storageBucket: "panchayat-prithvipura-chunav.firebasestorage.app",
            messagingSenderId: "1019711870876",
            appId: "1:1019711870876:web:bbcfae0b77916fb1935a59",
            measurementId: "G-E15MNMW7S9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isAdmin = false;
        const DEFAULT_PASS = "Yogesh@2004";
        let candidates = [];

        // रियल-टाइम लिसनर (डेटा सिंक रखने के लिए)
        db.ref('sarpanch_candidates').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                candidates = data;
            } else {
                candidates = [
                    { id: 1, name: "सरपंच प्रत्याशी 1", location: "ग्राम पंचायत पृथ्वीपुरा", symbol: "चश्मा", votes: 0, image: "https://via.placeholder.com/150?text=Photo" },
                    { id: 2, name: "सरपंच प्रत्याशी 2", location: "ग्राम पंचायत पृथ्वीपुरा", symbol: "ट्रैक्टर", votes: 0, image: "https://via.placeholder.com/150?text=Photo" }
                ];
                db.ref('sarpanch_candidates').set(candidates);
            }
            renderCandidates();
        }, (error) => {
            alert("Firebase Error: " + error.message + "\nकृपया अपने Firebase Rules में .read और .write को true करें!");
        });

        function syncToCloud() {
            return db.ref('sarpanch_candidates').set(candidates)
                .catch(err => alert("डेटा सेव नहीं हुआ: " + err.message));
        }

        function renderCandidates() {
            const grid = document.getElementById('sarpanch-grid');
            grid.innerHTML = '';

            candidates.forEach((c, index) => {
                grid.innerHTML += `
                    <div class="card">
                        <img id="preview-img-${index}" src="${c.image}" alt="${c.name}" onerror="this.src='https://via.placeholder.com/150?text=No+Photo'">
                        <h3>${c.name}</h3>
                        <p><b>स्थान:</b> ${c.location}</p>
                        <p><b>चिन्ह:</b> ${c.symbol}</p>
                        ${isAdmin ? `
                            <div class="edit-fields" style="display:block;">
                                <label><b>1. गैलरी से फ़ोटो चुनें:</b></label>
                                <input type="file" accept="image/*" onchange="previewImage(event, ${index})">
                                
                                <label><b>2. नाम:</b></label>
                                <input type="text" id="name-${index}" value="${c.name}">
                                
                                <label><b>3. स्थान:</b></label>
                                <input type="text" id="loc-${index}" value="${c.location}">
                                
                                <label><b>4. चिन्ह:</b></label>
                                <input type="text" id="sym-${index}" value="${c.symbol}">
                                
                                <button class="btn-save" onclick="manualSaveCandidate(${index})">💾 जानकारी सेव करें</button>
                                <button class="btn-delete" onclick="deleteCandidate(${index})">🗑️ प्रत्याशी हटाएं</button>
                            </div>
                        ` : `
                            <button class="vote-btn" onclick="castVote(${index})">वोट दें</button>
                        `}
                    </div>
                `;
            });
            renderResults();
        }

        function renderResults() {
            const res = document.getElementById('sarpanch-results');
            res.innerHTML = '';
            let totalVotes = candidates.reduce((sum, c) => sum + (c.votes || 0), 0);

            candidates.forEach(c => {
                let votes = c.votes || 0;
                let percentage = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
                res.innerHTML += `
                    <div style="margin-bottom: 12px;">
                        <strong>${c.name} (${c.symbol}):</strong> ${votes} वोट (${percentage}%)
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${percentage}%;">${percentage}%</div>
                        </div>
                    </div>
                `;
            });
        }

        // फोटो को छोटा (Compress) करके सेव करने का फ़ंक्शन
        function previewImage(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // फोटो को 150x150 पिक्सल में रीसाइज़ करें ताकि साइज़ बहुत छोटा (20 KB) हो जाए
                    canvas.width = 150;
                    canvas.height = 150;
                    ctx.drawImage(img, 0, 0, 150, 150);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById(`preview-img-${index}`).src = compressedBase64;
                    candidates[index].tempImage = compressedBase64;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function manualSaveCandidate(index) {
            const nameVal = document.getElementById(`name-${index}`).value;
            const locVal = document.getElementById(`loc-${index}`).value;
            const symVal = document.getElementById(`sym-${index}`).value;

            if (nameVal) candidates[index].name = nameVal;
            if (locVal) candidates[index].location = locVal;
            if (symVal) candidates[index].symbol = symVal;

            if (candidates[index].tempImage) {
                candidates[index].image = candidates[index].tempImage;
                delete candidates[index].tempImage;
            }

            await syncToCloud();
            alert("प्रत्याशी की जानकारी सफलतापूर्वक सेव हो गई है! ✅");
        }

        async function castVote(index) {
            let voted = localStorage.getItem('voted_sarpanch');
            if(voted) { alert("आप पहले ही वोट दे चुके हैं!"); return; }
            
            candidates[index].votes = (candidates[index].votes || 0) + 1;
            localStorage.setItem('voted_sarpanch', 'true');
            await syncToCloud();
            alert("आपका वोट तुरंत ऑनलाइन दर्ज हो गया है!");
        }

        function addCandidate() {
            candidates.push({ id: Date.now(), name: "नया प्रत्याशी", location: "ग्राम पंचायत पृथ्वीपुरा", symbol: "चिन्ह", votes: 0, image: "https://via.placeholder.com/150?text=Photo" });
            syncToCloud();
        }

        function deleteCandidate(index) {
            if(confirm("क्या आप इस प्रत्याशी को हटाना चाहते हैं?")) {
                candidates.splice(index, 1);
                syncToCloud();
            }
        }

        function resetVotes() {
            if(confirm("क्या आप सभी वोट 0 करना चाहते हैं?")) {
                candidates.forEach(c => c.votes = 0);
                localStorage.removeItem('voted_sarpanch');
                syncToCloud();
            }
        }

        function toggleAuth() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('admin-status').innerText = "मोड: सामान्य यूजर";
                document.getElementById('auth-btn').innerText = "Admin Login";
                document.getElementById('add-btn').style.display = "none";
                document.getElementById('reset-vote-btn').style.display = "none";
                renderCandidates();
            } else {
                document.getElementById('loginModal').style.display = 'flex';
            }
        }

        function checkPassword() {
            if (document.getElementById('adminPassword').value === DEFAULT_PASS) {
                isAdmin = true;
                document.getElementById('admin-status').innerText = "मोड: एडमिन";
                document.getElementById('auth-btn').innerText = "Logout";
                document.getElementById('add-btn').style.display = "inline-block";
                document.getElementById('reset-vote-btn').style.display = "inline-block";
                document.getElementById('adminPassword').value = '';
                closeLogin();
                renderCandidates();
            } else { alert("गलत पासवर्ड!"); }
        }

        function closeLogin() { document.getElementById('loginModal').style.display = 'none'; }
    </script>
</body>
</html>
